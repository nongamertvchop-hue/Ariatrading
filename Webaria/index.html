<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="copyright" content="Copyright (c) 2026 tryth5556 / nongamertvchop. All rights reserved.">
  <title>Webaria Chart</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b0e11; color: #d9dde3; font-family: Arial, Helvetica, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { height: 52px; flex: 0 0 52px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #252a31; background: #11151a; }
    .brand { font-size: 16px; font-weight: 700; margin-right: 8px; }
    select, button { border: 1px solid #303640; background: #181d23; color: #d9dde3; border-radius: 5px; padding: 7px 9px; font-size: 13px; }
    button { cursor: pointer; }
    .status { margin-left: auto; font-size: 12px; color: #89929e; }
    main { position: relative; flex: 1; min-height: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .hud { position: absolute; top: 12px; left: 12px; pointer-events: none; background: rgba(11,14,17,.86); border: 1px solid #252a31; border-radius: 6px; padding: 9px 11px; font-size: 12px; line-height: 1.6; max-width: calc(100% - 24px); }
    .hud strong { font-size: 14px; }
    .error { color: #e3a7a7; }
    .hint { position: absolute; right: 12px; bottom: 10px; color: #69727e; font-size: 11px; pointer-events: none; }
    @media (max-width: 560px) { .brand { display: none; } header { padding: 0 7px; } select, button { font-size: 12px; padding: 6px 7px; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">Webaria</div>
    <select id="symbol" aria-label="Symbol"><option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option><option>AUD/USD</option><option>USD/CAD</option></select>
    <select id="timeframe" aria-label="Timeframe"><option value="1m">1m</option><option value="5m">5m</option><option value="15m" selected>15m</option><option value="30m">30m</option><option value="1h">1h</option><option value="4h">4h</option><option value="1D">1D</option></select>
    <button id="refresh" type="button">Refresh</button>
    <div id="status" class="status">Connecting…</div>
  </header>
  <main id="chartWrap">
    <canvas id="chart"></canvas>
    <div id="hud" class="hud">Loading market data…</div>
    <div class="hint">Drag to pan · wheel/pinch to zoom</div>
  </main>
  <script>
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('chartWrap');
    const symbolEl = document.getElementById('symbol');
    const timeframeEl = document.getElementById('timeframe');
    const statusEl = document.getElementById('status');
    const hudEl = document.getElementById('hud');
    const state = { candles: [], zoom: 1, offset: 0, dragging: false, lastX: 0, loading: false };
    let pollTimer;

    function resize() {
      const ratio = window.devicePixelRatio || 1;
      const rect = wrap.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px';
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0); draw();
    }
    function visibleCount() { return Math.max(20, Math.min(state.candles.length, Math.floor(90 / state.zoom))); }
    function visibleSlice() {
      const count = visibleCount();
      const end = Math.max(count, state.candles.length - Math.max(0, Math.floor(state.offset)));
      return { data: state.candles.slice(Math.max(0, end - count), end) };
    }
    function niceStep(range) {
      const raw = range / 7, power = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-12)))), n = raw / power;
      return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * power;
    }
    function draw() {
      const rect = wrap.getBoundingClientRect(), w = rect.width, h = rect.height;
      ctx.clearRect(0, 0, w, h); ctx.fillStyle = '#0b0e11'; ctx.fillRect(0, 0, w, h);
      if (!state.candles.length) return;
      const { data } = visibleSlice(), left = 12, right = 74, top = 12, bottom = 28;
      const cw = Math.max(1, (w - left - right) / data.length);
      const lo0 = Math.min(...data.map(c => c.low)), hi0 = Math.max(...data.map(c => c.high));
      const pad = Math.max((hi0 - lo0) * .08, hi0 * .0002), lo = lo0 - pad, hi = hi0 + pad;
      const plotH = h - top - bottom, y = p => top + (hi - p) / (hi - lo) * plotH;
      ctx.strokeStyle = '#1c2229'; ctx.lineWidth = 1; ctx.font = '11px Arial'; ctx.fillStyle = '#69727e'; ctx.textAlign = 'left';
      const step = niceStep(hi - lo), first = Math.ceil(lo / step) * step;
      for (let p = first; p <= hi; p += step) { const yy = y(p); ctx.beginPath(); ctx.moveTo(left, yy); ctx.lineTo(w - right, yy); ctx.stroke(); ctx.fillText(p.toFixed(5), w - right + 7, yy + 4); }
      data.forEach((c, i) => {
        const x = left + (i + .5) * cw, openY = y(c.open), closeY = y(c.close), up = c.close >= c.open;
        ctx.strokeStyle = up ? '#52c48d' : '#e06b75'; ctx.fillStyle = ctx.strokeStyle;
        ctx.beginPath(); ctx.moveTo(x, y(c.high)); ctx.lineTo(x, y(c.low)); ctx.stroke();
        ctx.fillRect(x - Math.max(1, cw * .32), Math.min(openY, closeY), Math.max(1, cw * .64), Math.max(1, Math.abs(openY - closeY)));
      });
      const last = data[data.length - 1], ly = y(last.close);
      ctx.setLineDash([4, 4]); ctx.strokeStyle = '#59616c'; ctx.beginPath(); ctx.moveTo(left, ly); ctx.lineTo(w - right, ly); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#181d23'; ctx.fillRect(w - right, ly - 10, right - 7, 20); ctx.fillStyle = '#d9dde3'; ctx.fillText(Number(last.close).toFixed(5), w - right + 7, ly + 4);
      ctx.textAlign = 'center'; ctx.fillStyle = '#69727e';
      const labels = Math.max(2, Math.floor((w - left - right) / 100));
      for (let i = 0; i < labels; i++) { const idx = Math.min(data.length - 1, Math.floor(i * (data.length - 1) / Math.max(1, labels - 1))); const d = new Date(data[idx].datetime); if (!Number.isNaN(d.getTime())) ctx.fillText(d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), left + (idx + .5) * cw, h - 9); }
    }
    async function load() {
      if (state.loading) return; state.loading = true; statusEl.textContent = 'Updating…';
      try {
        const params = new URLSearchParams({ symbol: symbolEl.value, timeframe: timeframeEl.value });
        const response = await fetch(`/api/signal?${params}`, { cache: 'no-store' });
        const payload = await response.json(); if (!response.ok) throw new Error(payload.message || payload.error || `HTTP ${response.status}`);
        if (Array.isArray(payload.candles)) state.candles = payload.candles;
        else if (payload.price != null && state.candles.length) state.candles[state.candles.length - 1].close = Number(payload.price);
        hudEl.className = 'hud'; hudEl.innerHTML = `<strong>${payload.symbol || symbolEl.value}</strong><br>${payload.timeframe || timeframeEl.value} · ${payload.signal || 'WAIT'} · ${payload.price != null ? Number(payload.price).toFixed(5) : '—'}<br>${payload.state || ''}`;
        statusEl.textContent = payload.generated_at ? `Updated ${new Date(payload.generated_at).toLocaleTimeString()}` : 'Connected'; draw();
      } catch (error) { hudEl.className = 'hud error'; hudEl.textContent = `Market data unavailable: ${error.message}`; statusEl.textContent = 'Offline / error'; }
      finally { state.loading = false; }
    }
    function restartPolling() { clearInterval(pollTimer); pollTimer = setInterval(load, 15000); }
    symbolEl.addEventListener('change', () => { state.offset = 0; load(); }); timeframeEl.addEventListener('change', () => { state.offset = 0; load(); });
    document.getElementById('refresh').addEventListener('click', load); window.addEventListener('resize', resize);
    canvas.addEventListener('pointerdown', e => { state.dragging = true; state.lastX = e.clientX; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', e => { if (!state.dragging) return; const dx = e.clientX - state.lastX; state.lastX = e.clientX; const count = visibleCount(); state.offset = Math.max(0, Math.min(Math.max(0, state.candles.length - count), state.offset + dx / Math.max(1, wrap.clientWidth / count))); draw(); });
    canvas.addEventListener('pointerup', e => { state.dragging = false; canvas.releasePointerCapture(e.pointerId); }); canvas.addEventListener('pointercancel', () => { state.dragging = false; });
    canvas.addEventListener('wheel', e => { e.preventDefault(); state.zoom = Math.max(.5, Math.min(6, state.zoom * (e.deltaY < 0 ? 1.15 : .87))); draw(); }, { passive: false });
    resize(); load(); restartPolling();
  </script>
</body>
</html>
