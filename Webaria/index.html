<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="copyright" content="Copyright (c) 2026 tryth5556 / nongamertvchop. All rights reserved."><title>Webaria — Ariatrading Terminal</title><link rel="stylesheet" href="/trading.css"></head><body><div class="app"><header class="top"><div class="brand">Webaria</div><select id="symbol" class="ctl"><option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option><option>AUD/USD</option><option>USD/CAD</option></select><select id="tf" class="ctl"><option>1m</option><option>5m</option><option selected>15m</option><option>30m</option><option>1h</option><option>4h</option><option>1D</option></select><button id="fit" class="ctl">Fit</button><button id="cross" class="ctl">Crosshair</button><button id="refresh" class="ctl">Refresh</button><button id="mobile" class="ctl mobile-toggle">Watchlist</button><div class="quote"><strong id="quote">—</strong><span id="chg">—</span></div><div id="status" class="status">Connecting…</div></header><main class="main"><aside class="tools"><button class="tool active" data-tool="cursor">↖</button><button class="tool" data-tool="hline">━</button><button class="tool" data-tool="vline">│</button><button class="tool" data-tool="zone">□</button><button class="tool" data-tool="zoom">＋</button></aside><section id="chartwrap" class="chartwrap"><canvas id="chart" class="chart"></canvas><div id="legend" class="legend">Loading…</div></section><aside id="right" class="right"><div class="rhead"><span>Market Watch</span><span>ARIA</span></div><div class="tabs"><button class="active">Watchlist</button><button>Details</button></div><div id="watch" class="watch"></div><section class="panel"><h3>ARIA STRATEGY</h3><div class="metric"><span>Signal</span><b id="sig" class="signal">WAIT</b></div><div class="metric"><span>State</span><b id="state">—</b></div><div class="metric"><span>Structure</span><b id="structure">—</b></div><div class="metric"><span>Breakout</span><b id="breakout">—</b></div><div class="metric"><span>Score</span><b id="score">—</b></div><div id="reason" class="metric">Waiting for data…</div></section><section class="panel journal"><div class="paneltitle"><h3>SIGNAL JOURNAL</h3><button id="clearJournal" type="button">Clear</button></div><div id="journal" class="journal-list"><div class="journal-empty">No observations yet.</div></div></section><section class="panel paper"><h3>PAPER TRADING</h3><div class="metric"><span>Balance</span><b id="balance">10000.00</b></div><div class="metric"><span>Equity</span><b id="equity">10000.00</b></div><div class="metric"><span>Position</span><b id="pos">FLAT</b></div><div class="metric"><span>Entry</span><b id="entry">—</b></div><div class="metric"><span>P/L</span><b id="pnl">0.00</b></div><div class="papergrid"><input id="qty" type="number" value="1000" min="1"><input id="sl" type="number" placeholder="SL"></div><div class="papergrid"><input id="tp" type="number" placeholder="TP"><button id="close" disabled>Close</button></div><div class="papergrid"><button id="buy" class="long">LONG</button><button id="sell" class="short">SHORT</button></div></section></aside></main><footer class="bottom"><span class="spacer"></span><button data-tf="1m">1m</button><button data-tf="5m">5m</button><button class="active" data-tf="15m">15m</button><button data-tf="30m">30m</button><button data-tf="1h">1H</button><button data-tf="4h">4H</button><button data-tf="1D">1D</button><button id="reset">Reset view</button></footer></div><script src="/signal-journal.js"></script><script src="/signal-journal-ui.js"></script><script src="/trading.js"></script></body></html>
