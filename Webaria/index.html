<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="copyright" content="Copyright (c) 2026 tryth5556 / nongamertvchop. All rights reserved.">
  <title>Webaria Chart</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b0e11; color: #d9dde3; font-family: Arial, Helvetica, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { height: 52px; flex: 0 0 52px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #252a31; background: #11151a; }
    .brand { font-size: 16px; font-weight: 700; margin-right: 8px; letter-spacing: .2px; }
    select, button { border: 1px solid #303640; background: #181d23; color: #d9dde3; border-radius: 5px; padding: 7px 9px; font-size: 13px; }
    button { cursor: pointer; }
    .status { margin-left: auto; font-size: 12px; color: #89929e; white-space: nowrap; }
    main { position: relative; flex: 1; min-height: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .center-copy { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; padding: 24px; }
    .center-copy > div { max-width: 520px; padding: 18px 22px; border: 1px solid #252a31; border-radius: 8px; background: rgba(11,14,17,.86); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
    .center-copy strong { display: block; font-size: 22px; margin-bottom: 7px; }
    .center-copy span { color: #89929e; font-size: 13px; line-height: 1.5; }
    .hud { position: absolute; top: 12px; left: 12px; pointer-events: none; background: rgba(11,14,17,.86); border: 1px solid #252a31; border-radius: 6px; padding: 9px 11px; font-size: 12px; line-height: 1.6; max-width: calc(100% - 24px); }
    .hud strong { font-size: 14px; }
    .error { color: #e3a7a7; }
    .hint { position: absolute; right: 12px; bottom: 30px; color: #69727e; font-size: 11px; pointer-events: none; }
    .copyright { position: absolute; left: 12px; bottom: 9px; color: #4f5863; font-size: 10px; pointer-events: none; }
    @media (max-width: 560px) {
      .brand { display: none; }
      header { padding: 0 7px; }
      select, button { font-size: 12px; padding: 6px 7px; }
      .status { font-size: 10px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
      .center-copy strong { font-size: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Webaria</div>
    <select id="symbol" aria-label="Symbol"><option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option><option>AUD/USD</option><option>USD/CAD</option></select>
    <select id="timeframe" aria-label="Timeframe"><option value="1m">1m</option><option value="5m">5m</option><option value="15m" selected>15m</option><option value="30m">30m</option><option value="1h">1h</option><option value="4h">4h</option><option value="1D">1D</option></select>
    <button id="refresh" type="button">Refresh</button>
    <div id="status" class="status">Connecting…</div>
  </header>
  <main id="chartWrap">
    <canvas id="chart"></canvas>
    <div id="centerCopy" class="center-copy"><div><strong>Webaria</strong><span id="centerMessage">Loading market data…</span></div></div>
    <div id="hud" class="hud">Loading market data…</div>
    <div class="hint">Drag to pan · wheel/pinch to zoom</div>
    <div class="copyright">© 2026 tryth5556 / nongamertvchop · All rights reserved.</div>
  </main>
  <script>
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('chartWrap');
    const symbolEl = document.getElementById('symbol');
    const timeframeEl = document.getElementById('timeframe');
    const statusEl = document.getElementById('status');
    const hudEl = document.getElementById('hud');
    const centerCopyEl = document.getElementById('centerCopy');
    const centerMessageEl = document.getElementById('centerMessage');
    const state = { candles: [], livePrice: null, zoom: 1, offset: 0, dragging: false, lastX: 0, loading: false };
    let historyTimer;
    let priceTimer;

    function resize() {
      const ratio = window.devicePixelRatio || 1;
      const rect = wrap.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      draw();
    }

    function visibleCount() { return Math.max(20, Math.min(state.candles.length, Math.floor(90 / state.zoom))); }

    function visibleSlice() {
      const count = visibleCount();
      const end = Math.max(count, state.candles.length - Math.max(0, Math.floor(state.offset)));
      return { data: state.candles.slice(Math.max(0, end - count), end) };
    }

    function niceStep(range) {
      const raw = range / 7;
      const power = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-12))));
      const n = raw / power;
      return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * power;
    }

    function drawGrid(w, h, left, right, top, bottom) {
      ctx.fillStyle = '#0b0e11';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#171c22';
      ctx.lineWidth = 1;
      const plotW = Math.max(1, w - left - right);
      const plotH = Math.max(1, h - top - bottom);
      for (let i = 1; i <= 6; i += 1) {
        const x = left + plotW * i / 7;
        ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, h - bottom); ctx.stroke();
      }
      for (let i = 1; i <= 7; i += 1) {
        const y = top + plotH * i / 8;
        ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(w - right, y); ctx.stroke();
      }
    }

    function draw() {
      const rect = wrap.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const left = 12, right = 74, top = 12, bottom = 28;
      drawGrid(w, h, left, right, top, bottom);
      if (!state.candles.length) return;

      const { data } = visibleSlice();
      const cw = Math.max(1, (w - left - right) / data.length);
      const prices = data.flatMap(c => [c.low, c.high]);
      if (Number.isFinite(state.livePrice)) prices.push(state.livePrice);
      const lo0 = Math.min(...prices), hi0 = Math.max(...prices);
      const pad = Math.max((hi0 - lo0) * .08, hi0 * .0002);
      const lo = lo0 - pad, hi = hi0 + pad;
      const plotH = h - top - bottom;
      const y = p => top + (hi - p) / (hi - lo) * plotH;

      ctx.strokeStyle = '#1c2229';
      ctx.lineWidth = 1;
      ctx.font = '11px Arial';
      ctx.fillStyle = '#69727e';
      ctx.textAlign = 'left';
      const step = niceStep(hi - lo);
      const first = Math.ceil(lo / step) * step;
      for (let p = first; p <= hi; p += step) {
        const yy = y(p);
        ctx.beginPath(); ctx.moveTo(left, yy); ctx.lineTo(w - right, yy); ctx.stroke();
        ctx.fillText(p.toFixed(5), w - right + 7, yy + 4);
      }

      data.forEach((c, i) => {
        const x = left + (i + .5) * cw;
        const openY = y(c.open), closeY = y(c.close), up = c.close >= c.open;
        ctx.strokeStyle = up ? '#52c48d' : '#e06b75';
        ctx.fillStyle = ctx.strokeStyle;
        ctx.beginPath(); ctx.moveTo(x, y(c.high)); ctx.lineTo(x, y(c.low)); ctx.stroke();
        ctx.fillRect(x - Math.max(1, cw * .32), Math.min(openY, closeY), Math.max(1, cw * .64), Math.max(1, Math.abs(openY - closeY)));
      });

      const last = data[data.length - 1], ly = y(last.close);
      ctx.setLineDash([4, 4]); ctx.strokeStyle = '#59616c';
      ctx.beginPath(); ctx.moveTo(left, ly); ctx.lineTo(w - right, ly); ctx.stroke(); ctx.setLineDash([]);
      if (Number.isFinite(state.livePrice)) {
        const liveY = y(state.livePrice);
        ctx.setLineDash([6, 3]); ctx.strokeStyle = '#d9dde3';
        ctx.beginPath(); ctx.moveTo(left, liveY); ctx.lineTo(w - right, liveY); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#d9dde3'; ctx.fillRect(w - right, liveY - 10, right - 7, 20);
        ctx.fillStyle = '#0b0e11'; ctx.fillText(state.livePrice.toFixed(5), w - right + 7, liveY + 4);
      } else {
        ctx.fillStyle = '#181d23'; ctx.fillRect(w - right, ly - 10, right - 7, 20);
        ctx.fillStyle = '#d9dde3'; ctx.fillText(Number(last.close).toFixed(5), w - right + 7, ly + 4);
      }

      ctx.textAlign = 'center'; ctx.fillStyle = '#69727e';
      const labels = Math.max(2, Math.floor((w - left - right) / 100));
      for (let i = 0; i < labels; i += 1) {
        const idx = Math.min(data.length - 1, Math.floor(i * (data.length - 1) / Math.max(1, labels - 1)));
        const d = new Date(data[idx].datetime);
        if (!Number.isNaN(d.getTime())) ctx.fillText(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), left + (idx + .5) * cw, h - 9);
      }
    }

    function showCenter(message, visible = true) {
      centerMessageEl.textContent = message;
      centerCopyEl.style.display = visible ? 'grid' : 'none';
    }

    async function loadHistory() {
      if (state.loading) return;
      state.loading = true;
      statusEl.textContent = 'Updating candles…';
      try {
        const params = new URLSearchParams({ symbol: symbolEl.value, timeframe: timeframeEl.value });
        const response = await fetch(`/api/signal?${params}`, { cache: 'no-store' });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.message || payload.error || `HTTP ${response.status}`);
        if (!Array.isArray(payload.candles) || payload.candles.length === 0) throw new Error('API returned no completed candles');
        state.candles = payload.candles;
        showCenter('', false);
        hudEl.className = 'hud';
        hudEl.innerHTML = `<strong>${payload.symbol || symbolEl.value}</strong><br>${payload.timeframe || timeframeEl.value} · ${payload.signal || 'WAIT'} · live ${Number.isFinite(state.livePrice) ? state.livePrice.toFixed(5) : '—'}<br>${payload.state || ''}`;
        statusEl.textContent = 'Candles updated';
        draw();
      } catch (error) {
        showCenter(`Market data unavailable: ${error.message}`, true);
        hudEl.className = 'hud error';
        hudEl.textContent = `Market data unavailable: ${error.message}`;
        statusEl.textContent = 'Offline / error';
        draw();
      } finally {
        state.loading = false;
      }
    }

    async function loadLivePrice() {
      try {
        const params = new URLSearchParams({ symbol: symbolEl.value });
        const response = await fetch(`/api/price?${params}`, { cache: 'no-store' });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.message || payload.error || `HTTP ${response.status}`);
        state.livePrice = Number(payload.price);
        statusEl.textContent = `Live ${new Date(payload.generated_at).toLocaleTimeString()}`;
        draw();
      } catch (error) {
        if (!state.candles.length) showCenter(`Live price unavailable: ${error.message}`, true);
        statusEl.textContent = 'Live price error';
      }
    }

    function restartPolling() {
      clearInterval(historyTimer);
      clearInterval(priceTimer);
      historyTimer = setInterval(loadHistory, 60000);
      priceTimer = setInterval(loadLivePrice, 5000);
    }

    symbolEl.addEventListener('change', () => { state.offset = 0; state.livePrice = null; loadHistory(); loadLivePrice(); });
    timeframeEl.addEventListener('change', () => { state.offset = 0; loadHistory(); });
    document.getElementById('refresh').addEventListener('click', () => { loadHistory(); loadLivePrice(); });
    window.addEventListener('resize', resize);

    canvas.addEventListener('pointerdown', e => { state.dragging = true; state.lastX = e.clientX; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', e => {
      if (!state.dragging) return;
      const dx = e.clientX - state.lastX;
      state.lastX = e.clientX;
      const count = visibleCount();
      state.offset = Math.max(0, Math.min(Math.max(0, state.candles.length - count), state.offset + dx / Math.max(1, wrap.clientWidth / count)));
      draw();
    });
    canvas.addEventListener('pointerup', e => { state.dragging = false; canvas.releasePointerCapture(e.pointerId); });
    canvas.addEventListener('pointercancel', () => { state.dragging = false; });
    canvas.addEventListener('wheel', e => { e.preventDefault(); state.zoom = Math.max(.5, Math.min(6, state.zoom * (e.deltaY < 0 ? 1.15 : .87))); draw(); }, { passive: false });

    resize();
    loadHistory();
    loadLivePrice();
    restartPolling();
  </script>
</body>
</html>
