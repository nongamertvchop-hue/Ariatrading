name: polyglot-security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  polyglot-security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build C++ validator
        run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic polyglot/cpp/main.cpp -o /tmp/ariatrading-cpp-validator
      - name: Build Go validator
        working-directory: polyglot/go-validator
        run: go build -o /tmp/ariatrading-go-validator .
      - name: Build Java validator
        working-directory: polyglot/java-validator
        run: javac MarketDataValidator.java
      - name: Build Rust validator
        working-directory: polyglot/rust-validator
        run: cargo build --release
      - name: Inventory actual language usage
        run: python polyglot/security_inventory.py
      - name: Run fail-closed cross-language security gate
        env:
          ARIATRADING_SECURITY_WORKERS: >-
            {"cpp":["/tmp/ariatrading-cpp-validator"],"go":["/tmp/ariatrading-go-validator"],"java":["java","-cp","polyglot/java-validator","MarketDataValidator"],"rust":["polyglot/rust-validator/target/release/ariatrading-market-validator"]}
        run: python polyglot/security_gate.py
      - name: Run security gate regression tests
        run: python -m pytest -q tests/test_polyglot_security_gate.py
