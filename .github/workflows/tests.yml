name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and research dependencies
        run: python -m pip install --upgrade pip pytest scikit-learn pandas torch
      - name: Run tests
        run: python -m pytest -q

  worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate cross-language MT5 contract fixture
        run: python tests/e2e_mt5_contract.py
      - name: Run Worker, Webaria, and MT5 contract tests
        run: node --test tests/worker_signal_parity.test.mjs tests/realtime_full_parity.test.mjs tests/web_signal_journal.test.mjs tests/web_paper_engine.test.mjs tests/web_chart_data_compat.test.mjs tests/web_price_action_pages.test.mjs tests/test_worker_mt5_single_source.mjs tests/test_mt5_snapshot_fingerprint.mjs tests/e2e_mt5_contract.test.mjs

  worker-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker, Pages signal, chart, Bodyguard, and MT5 contract test syntax
        run: node --check worker/index.js && node --check worker/entry.js && node --check worker/signal_parity.js && node --check worker/signal_parity_v2.js && node --check Webaria/functions/api/signal.js && node --check Webaria/functions/api/market.js && node --check Webaria/functions/api/bodyguard/status.js && node --check Webaria/chart-data-compat.js && node --check Webaria/paper-runtime.js && node --check Webaria/trading.js && node --check Webaria/live-market.js && node --check tests/test_worker_mt5_single_source.mjs && node --check tests/test_mt5_snapshot_fingerprint.mjs && node --check tests/e2e_mt5_contract.test.mjs

  polyglot-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Verify native toolchains
        run: |
          g++ --version
          go version
          java -version
          rustc --version
          cargo --version
      - name: Build C++ validator
        run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic polyglot/cpp/main.cpp -o /tmp/ariatrading-cpp-validator
      - name: Build Go validator
        working-directory: polyglot/go-validator
        run: go build -o /tmp/ariatrading-go-validator .
      - name: Build Java validator
        working-directory: polyglot/java-validator
        run: javac MarketDataValidator.java
      - name: Build Rust validator
        working-directory: polyglot/rust-validator
        run: cargo build --release
      - name: Smoke test all validators
        shell: bash
        run: |
          printf '1725900000\t1.1000\t1.1020\t1.0990\t1.1010\n1725900060\t1.1010\t1.1030\t1.1000\t1.1020\n' > /tmp/ariatrading-sample.tsv
          for cmd in "/tmp/ariatrading-cpp-validator" "/tmp/ariatrading-go-validator" "java -cp polyglot/java-validator MarketDataValidator" "polyglot/rust-validator/target/release/ariatrading-market-validator"; do
            echo "== $cmd =="
            bash -lc "$cmd < /tmp/ariatrading-sample.tsv | tee /tmp/validator.out"
            grep -Fq '"ok":true' /tmp/validator.out
          done
