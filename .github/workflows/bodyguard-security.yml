name: bodyguard-security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files for high-confidence secrets
        run: python scripts/security_scan.py

  worker-security-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Bodyguard JavaScript
        run: node --check bodyguard/worker/bodyguard.js && node --check bodyguard/worker/redaction.js && node --check worker/entry.js
